name: Deploy ZGR CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate and build application
        run: npm run quality
        env:
          VITE_ZGR_API_URL: https://zgr-cv-storage-api.zgrcv-wizi.workers.dev/api/clients
          VITE_ZGR_BUILD_ID: "${{ github.sha }}"
      - name: Publish build version marker
        run: |
          node -e "require('fs').writeFileSync('dist-spa/version.json', JSON.stringify({ buildId: process.env.GITHUB_SHA }))"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-spa

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
