name: ZGR CV Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript, lint, tests, SPA build, bundle budget and Worker validation
        run: npm run quality
        env:
          VITE_ZGR_API_URL: https://zgr-cv-storage-api.zgrcv-wizi.workers.dev/api/clients
          VITE_ZGR_BUILD_ID: "${{ github.sha }}"
